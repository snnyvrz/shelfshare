name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.4"
  BUN_VERSION: "1.3.3"
  NX_BASE: origin/main
  NX_HEAD: HEAD

jobs:
  books-service_tests:
    name: books-service unit tests & coverage (Nx + Go) & integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: apps/books-service/go.sum

      - name: Install JS/TS dependencies
        run: bun install --frozen-lockfile

      - name: Generate Swagger docs via Nx
        run: bun x nx run books-service:swagger

      - name: Run books-service coverage via Nx
        run: bun x nx run books-service:coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: books-service-coverage
          path: |
            apps/books-service/coverage/coverage.out
            apps/books-service/coverage/coverage.html

      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - name: Run integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: shelfshare
          POSTGRES_PASSWORD: shelfshare
          POSTGRES_DB: shelfshare
          TZ: UTC
        run: go test -tags=integration ./...
        working-directory: apps/books-service
