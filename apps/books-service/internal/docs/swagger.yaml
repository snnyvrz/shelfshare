basePath: /api
definitions:
  handler.Author:
    properties:
      bio:
        type: string
      books:
        items:
          $ref: "#/definitions/handler.BookSummary"
        type: array
      created_at:
        example: "2025-11-24"
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        example: "2025-11-24"
        type: string
    type: object
  handler.AuthorResponse:
    properties:
      data:
        $ref: "#/definitions/handler.Author"
    type: object
  handler.AuthorSummary:
    properties:
      bio:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  handler.Book:
    properties:
      author:
        $ref: "#/definitions/handler.AuthorSummary"
      created_at:
        example: "2025-11-24"
        type: string
      description:
        type: string
      id:
        type: string
      published_at:
        example: "2025-11-24"
        type: string
      title:
        type: string
      updated_at:
        example: "2025-11-24"
        type: string
    type: object
  handler.BookResponse:
    properties:
      data:
        $ref: "#/definitions/handler.Book"
    type: object
  handler.BookSummary:
    properties:
      created_at:
        example: "2025-11-24"
        type: string
      description:
        type: string
      id:
        type: string
      published_at:
        example: "2025-11-24"
        type: string
      title:
        type: string
      updated_at:
        example: "2025-11-24"
        type: string
    type: object
  handler.CreateAuthorRequest:
    properties:
      bio:
        maxLength: 2000
        type: string
      name:
        minLength: 1
        type: string
    required:
      - name
    type: object
  handler.CreateBookRequest:
    properties:
      author_id:
        type: string
      description:
        type: string
      published_at:
        example: "2025-11-24"
        type: string
      title:
        type: string
    required:
      - author_id
      - title
    type: object
  handler.ListBooksResponse:
    properties:
      data:
        items:
          $ref: "#/definitions/handler.Book"
        type: array
      pagination:
        $ref: "#/definitions/handler.Pagination"
    type: object
  handler.Pagination:
    properties:
      page:
        minimum: 1
        type: integer
      page_size:
        minimum: 1
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  handler.UpdateAuthorRequest:
    properties:
      bio:
        maxLength: 2000
        type: string
      name:
        minLength: 1
        type: string
    type: object
  handler.UpdateBookRequest:
    properties:
      author_id:
        type: string
      description:
        maxLength: 2000
        type: string
      published_at:
        example: "2025-11-24"
        type: string
      title:
        minLength: 1
        type: string
    type: object
  lending.Conversation:
    properties:
      createdAt:
        type: string
      id:
        type: string
      initiator:
        type: string
      lastMessage:
        $ref: "#/definitions/lending.Message"
      peerReadAt:
        type: string
      request:
        $ref: "#/definitions/lending.Request"
      requestId:
        type: string
      status:
        type: string
      unread:
        type: integer
      updatedAt:
        type: string
      userA:
        type: string
      userB:
        type: string
    type: object
  lending.Copy:
    properties:
      archived:
        type: boolean
      availability:
        type: string
      book:
        $ref: "#/definitions/model.Book"
      bookId:
        type: string
      condition:
        type: string
      createdAt:
        type: string
      id:
        type: string
      lendable:
        type: boolean
      notes:
        type: string
      ownerId:
        type: string
      updatedAt:
        type: string
      visible:
        type: boolean
    type: object
  lending.Message:
    properties:
      body:
        type: string
      conversationId:
        type: string
      createdAt:
        type: string
      id:
        type: string
      senderId:
        type: string
    type: object
  lending.Request:
    properties:
      acceptedAt:
        type: string
      borrowedAt:
        type: string
      borrowerId:
        type: string
      closedAt:
        type: string
      copy:
        $ref: "#/definitions/lending.Copy"
      copyId:
        type: string
      createdAt:
        type: string
      dueAt:
        type: string
      id:
        type: string
      message:
        type: string
      ownerId:
        type: string
      returnPendingAt:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  lending.copyInput:
    properties:
      bookId:
        type: string
      condition:
        type: string
      lendable:
        type: boolean
      notes:
        type: string
      visible:
        type: boolean
    type: object
  model.Author:
    properties:
      bio:
        type: string
      books:
        items:
          $ref: "#/definitions/model.Book"
        type: array
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
  model.Book:
    properties:
      author:
        $ref: "#/definitions/model.Author"
      authorID:
        type: string
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      publishedAt:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    type: object
  validation.ErrorResponse:
    properties:
      code:
        type: string
      errors:
        items:
          $ref: "#/definitions/validation.FieldError"
        type: array
      message:
        type: string
    type: object
  validation.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
      rule:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: sinaniya@gmail.com
    name: Sina Niyavarzi
  description: API for managing books in Shelfshare.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Shelfshare Books API
  version: "1.0"
paths:
  /authors:
    get:
      consumes:
        - application/json
      description: Get a list of all authors
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: "#/definitions/handler.AuthorResponse"
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
      summary: List authors
      tags:
        - authors
    post:
      consumes:
        - application/json
      description: Create a new author with name and optional bio
      parameters:
        - description: Author to create
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/handler.CreateAuthorRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/handler.AuthorResponse"
        "400":
          description: Validation error
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "401":
          description: Login required
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Create an author
      tags:
        - authors
  /authors/{id}:
    delete:
      consumes:
        - application/json
      description: Delete an author by ID
      parameters:
        - description: Author ID (UUID)
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid ID
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "401":
          description: Login required
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "404":
          description: Author not found
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Delete an author
      tags:
        - authors
    get:
      consumes:
        - application/json
      description: Get a single author by its ID
      parameters:
        - description: Author ID (UUID)
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/handler.AuthorResponse"
        "400":
          description: Invalid ID
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "404":
          description: Author not found
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
      summary: Get author by ID
      tags:
        - authors
    patch:
      consumes:
        - application/json
      description: Partially update an existing author
      parameters:
        - description: Author ID (UUID)
          in: path
          name: id
          required: true
          type: string
        - description: Author fields to update
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/handler.UpdateAuthorRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/handler.AuthorResponse"
        "400":
          description: Invalid ID or validation error
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "401":
          description: Login required
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "404":
          description: Author not found
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Update an author
      tags:
        - authors
  /blocks:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
        - BearerAuth: []
      summary: List readers you have blocked
      tags:
        - Messaging
  /blocks/{user}:
    delete:
      parameters:
        - description: User ID
          in: path
          name: user
          required: true
          type: string
      responses:
        "204":
          description: No Content
      security:
        - BearerAuth: []
      summary: Unblock a reader
      tags:
        - Messaging
    post:
      parameters:
        - description: User ID
          in: path
          name: user
          required: true
          type: string
      responses:
        "204":
          description: No Content
      security:
        - BearerAuth: []
      summary: Block direct messages and presence sharing from a reader
      tags:
        - Messaging
  /books:
    get:
      description: Get all books
      parameters:
        - default: 1
          description: Page number
          in: query
          minimum: 1
          name: page
          type: integer
        - default: 20
          description: Items per page
          in: query
          maximum: 100
          minimum: 1
          name: page_size
          type: integer
        - description: Sort field and direction
          enum:
            - created_at_desc
            - created_at_asc
            - title_asc
            - title_desc
            - published_at_desc
            - published_at_asc
          in: query
          name: sort
          type: string
        - description: Full-text search on title and description
          in: query
          name: q
          type: string
        - description: Filter by author ID (UUID)
          in: query
          name: author_id
          type: string
        - description: "Filter: published_at >= YYYY-MM-DD"
          example: "2015-01-01"
          in: query
          name: published_after
          type: string
        - description: "Filter: published_at <= YYYY-MM-DD"
          example: "2020-12-31"
          in: query
          name: published_before
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/handler.ListBooksResponse"
        "400":
          description: Invalid query parameters
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
      summary: List books
      tags:
        - books
    post:
      consumes:
        - application/json
      description: Create a new book with title, author, description and optional
        published date
      parameters:
        - description: Book to create
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/handler.CreateBookRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/handler.BookResponse"
        "400":
          description: Validation error
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "401":
          description: Login required
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Create a book
      tags:
        - books
  /books/{id}:
    delete:
      description: Delete a book by its UUID
      parameters:
        - description: Book ID (UUID)
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "204":
          description: No content
          schema:
            type: string
        "400":
          description: Invalid ID
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "401":
          description: Login required
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "404":
          description: Book not found
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Delete a book
      tags:
        - books
    get:
      description: Get a single book by its UUID
      parameters:
        - description: Book ID (UUID)
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/handler.BookResponse"
        "400":
          description: Invalid ID
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "404":
          description: Book not found
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
      summary: Get a book by ID
      tags:
        - books
    patch:
      consumes:
        - application/json
      description: Partially update a book by its UUID
      parameters:
        - description: Book ID (UUID)
          in: path
          name: id
          required: true
          type: string
        - description: Fields to update
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/handler.UpdateBookRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/handler.BookResponse"
        "400":
          description: Invalid ID or payload
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "401":
          description: Login required
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "404":
          description: Book not found
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/validation.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Update a book
      tags:
        - books
  /conversations:
    get:
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
        - BearerAuth: []
      summary: List your private conversations and unread counts
      tags:
        - Messaging
    post:
      consumes:
        - application/json
      parameters:
        - description: userId
          in: body
          name: recipient
          required: true
          schema:
            additionalProperties:
              type: string
            type: object
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/lending.Conversation"
      security:
        - BearerAuth: []
      summary: Start or find a direct conversation
      tags:
        - Messaging
  /conversations/{id}:
    get:
      parameters:
        - description: Conversation ID
          in: path
          name: id
          required: true
          type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/lending.Conversation"
      security:
        - BearerAuth: []
      summary: Read a conversation as a participant
      tags:
        - Messaging
  /conversations/{id}/{action}:
    post:
      parameters:
        - description: Conversation ID
          in: path
          name: id
          required: true
          type: string
        - description: accept, decline or read
          in: path
          name: action
          required: true
          type: string
      responses:
        "204":
          description: No Content
      security:
        - BearerAuth: []
      summary: Accept/decline a message request or mark a conversation read
      tags:
        - Messaging
  /conversations/{id}/messages:
    get:
      parameters:
        - description: Conversation ID
          in: path
          name: id
          required: true
          type: string
        - description: RFC3339 timestamp cursor
          in: query
          name: before
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
        - BearerAuth: []
      summary: Read private message history (newest page first)
      tags:
        - Messaging
    post:
      consumes:
        - application/json
      parameters:
        - description: Conversation ID
          in: path
          name: id
          required: true
          type: string
        - description: id and body
          in: body
          name: message
          required: true
          schema:
            additionalProperties:
              type: string
            type: object
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/lending.Message"
      security:
        - BearerAuth: []
      summary: Send a message with a client-generated UUID (idempotent retry)
      tags:
        - Messaging
  /copies:
    get:
      parameters:
        - description: Shelf owner
          in: query
          name: ownerId
          type: string
        - description: Catalog book
          in: query
          name: bookId
          type: string
        - description: Page (50 copies)
          in: query
          name: page
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List physical copies
      tags:
        - Shelves
    post:
      consumes:
        - application/json
      parameters:
        - description: Copy details
          in: body
          name: copy
          required: true
          schema:
            $ref: "#/definitions/lending.copyInput"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/lending.Copy"
      security:
        - BearerAuth: []
      summary: Add a physical copy to your shelf
      tags:
        - Shelves
  /copies/{id}:
    delete:
      parameters:
        - description: Copy ID
          in: path
          name: id
          required: true
          type: string
      responses:
        "204":
          description: No Content
        "409":
          description: Copy is reserved or on loan
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Archive your unoccupied copy, preserving history
      tags:
        - Shelves
    patch:
      consumes:
        - application/json
      parameters:
        - description: Copy ID
          in: path
          name: id
          required: true
          type: string
        - description: Condition, notes, visibility and lending preference
          in: body
          name: details
          required: true
          schema:
            $ref: "#/definitions/lending.copyInput"
      responses:
        "204":
          description: No Content
      security:
        - BearerAuth: []
      summary: Edit your physical copy (ownership and catalog title are immutable)
      tags:
        - Shelves
  /copies/{id}/requests:
    post:
      consumes:
        - application/json
      parameters:
        - description: Copy ID
          in: path
          name: id
          required: true
          type: string
        - description: Request message
          in: body
          name: request
          required: true
          schema:
            additionalProperties:
              type: string
            type: object
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/lending.Request"
      security:
        - BearerAuth: []
      summary: Request to borrow a physical copy
      tags:
        - Borrowing
  /me/copies:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
        - BearerAuth: []
      summary: List your private shelf, including hidden copies
      tags:
        - Shelves
  /nearby/copies:
    get:
      parameters:
        - description: city or radius
          in: query
          name: mode
          required: true
          type: string
        - description: Origin city ID from auth-service /cities
          in: query
          name: cityId
          required: true
          type: string
        - description: City-centre radius (1–500 km)
          in: query
          name: radiusKm
          type: number
        - description: Page (50 copies)
          in: query
          name: page
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      security:
        - BearerAuth: []
      summary: Discover public copies by their owners' selected cities
      tags:
        - Shelves
  /request-conversations/{id}:
    get:
      parameters:
        - description: Borrow request ID
          in: path
          name: id
          required: true
          type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/lending.Conversation"
      security:
        - BearerAuth: []
      summary: Find a borrowing conversation as a participant
      tags:
        - Messaging
  /requests:
    get:
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
        - BearerAuth: []
      summary: List your borrowing and lending requests
      tags:
        - Borrowing
  /requests/{id}/{action}:
    post:
      consumes:
        - application/json
      parameters:
        - description: Request ID
          in: path
          name: id
          required: true
          type: string
        - description: Action
          in: path
          name: action
          required: true
          type: string
        - description: Optional RFC3339 dueAt
          in: body
          name: terms
          required: true
          schema:
            additionalProperties:
              type: string
            type: object
      responses:
        "204":
          description: No Content
      security:
        - BearerAuth: []
      summary: Change borrowing status (accept, decline, cancel, handover, return,
        confirm-return)
      tags:
        - Borrowing
  /ws-ticket:
    post:
      consumes:
        - application/json
      description: "Connect to /api/ws?ticket=... within 30 seconds. The Origin must
        match the ticket. Events: message, requests, conversations, accept, decline,
        read, presence, typing, blocked, ack, error. Send message with conversationId,
        id and body; presence/typing with conversationId. Connections expire with
        the JWT."
      parameters:
        - description: Browser origin
          in: body
          name: origin
